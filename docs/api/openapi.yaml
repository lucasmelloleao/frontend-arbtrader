    BotStatusResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [isScanningEnabled, isOnline, botName]
              properties:
                isScanningEnabled:
                  type: boolean
                  description: Indica se o scanner automático de oportunidades está ativado
                isOnline:
                  type: boolean
                  description: Indica se o robô enviou heartbeat nos últimos 3 minutos (operante)
                lastHeartbeat:
                  type: string
                  format: date-time
                  nullable: true
                  description: Timestamp da última pulsação do robô
                botName:
                  type: string
                  example: funding-arb
    PerpArbTradesSummaryResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required:
                [operacoesEncerradas, totalPnl, aprPct, monthlyPct, totalEntradaUsd, totalSaidaUsd]
              properties:
                operacoesEncerradas:
                  type: number
                  example: 94
                  description: Quantidade total de operações encerradas
                totalPnl:
                  type: number
                  example: 47.95
                  description: PnL líquido total acumulado em USD
                aprPct:
                  type: number
                  example: 7.2
                  description: Taxa de retorno anualizada estipulada (APR % a.a.)
                monthlyPct:
                  type: number
                  example: 0.6
                  description: Taxa de retorno mensal (% a.m.)
                totalEntradaUsd:
                  type: number
                  example: 9123.54
                  description: Volume total acumulado de entrada nas operações em USD
                totalSaidaUsd:
                  type: number
                  example: 9171.49
                  description: Volume total acumulado de saída das operações em USD (Entrada + PnL)
    PerpArbAuditExchangeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [exchange, periodDays, startDate, endDate, totais, detalhesPorAtivo]
              properties:
                exchange:
                  type: string
                  example: MEXC
                periodDays:
                  type: number
                  example: 5
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                totais:
                  type: object
                  properties:
                    totalEntradaSpot:
                      type: number
                    totalSaidaSpot:
                      type: number
                    totalPnlSpot:
                      type: number
                    totalPnlPerp:
                      type: number
                    taxasSpot:
                      type: number
                    taxasPerp:
                      type: number
                    totalTaxasTaker:
                      type: number
                    resultadoLiquidoTotal:
                      type: number
                detalhesPorAtivo:
                  type: array
                  items:
                    type: object
                    properties:
                      symbol:
                        type: string
                      volumeEntradaSpot:
                        type: number
                      volumeSaidaSpot:
                        type: number
                      pnlBrutoSpot:
                        type: number
                      pnlBrutoPerp:
                        type: number
                      taxasSpot:
                        type: number
                      taxasPerp:
                        type: number
                      totalTaxas:
                        type: number
                      resultadoLiquidoReal:
                        type: number
                      tradesCount:
                        type: number
                      emAbertoDesconsiderado:
                        type: number
                      trades:
                        type: array
                        description: Lista de todas as execuções de ordens individuais (Spot + Perpétuo) da moeda
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                              enum: [SPOT, PERP]
                            symbol:
                              type: string
                            side:
                              type: string
                              enum: [BUY, SELL, OPEN_SHORT, CLOSE_SHORT]
                            time:
                              type: string
                              format: date-time
                            amount:
                              type: number
                            price:
                              type: number
                            volumeUsd:
                              type: number
                            feeCost:
                              type: number
                            feeCurrency:
                              type: string
                            feeUsd:
                              type: number
