openapi: 3.0.3
info:
  title: ArbTrade API
  description: |
    Contrato do backend REST consumido pelo frontend (boilerplate Next.js 16).

    Regras do envelope (toda resposta, sucesso e erro):
    - `success` (boolean) e `message` (string) são SEMPRE presentes.
    - `data` carrega o payload específico do endpoint (opcional).
    - Erros usam status HTTP coerente e `message` em PT-BR (texto seguro p/ UI).
    - O front NUNCA decodifica o JWT: a identidade vem do cookie de sessão.

    Autenticação:
    - Login/logout são chamadas browser-direct: o backend emite/limpa os cookies
      httpOnly `session_token` (access) e `refresh_token` (apenas com rememberMe).
    - Demais endpoints são chamados server-side (RSC/Server Actions) e o cookie
      da requisição é encaminhado como header `Cookie` pelo `kyServer`.
    - Authz é sempre do backend; o front apenas encaminha o cookie.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Mesmo origin via proxy do Next (dev) ou domínio same-site (prod)
tags:
  - name: Auth
    description: Sessão (login, logout)
  - name: Perfil
    description: Perfil do usuário autenticado
  - name: Exchanges
    description: Chaves de API de corretoras centralizadas (CEX)
  - name: Portfolio
    description: Resumo patrimonial, evolução e posições ao vivo
  - name: PerpArb
    description: Estratégias e operações de arbitragem perpétuo vs spot (Funding Arb)
  - name: Usuarios
    description: Manutenção administrativa de usuários
paths:
  /login:
    post:
      tags: [Auth]
      summary: Autentica o usuário e emite o cookie de sessão
      description: |
        Chamada browser-direct. Em sucesso, responde 200 e devolve o cookie
        httpOnly `session_token` (via Set-Cookie). Quando o usuário tem 2FA
        habilitado e `twoFactorToken` não é enviado, responde 401 com a mensagem
        exata `2fa_required` (o front detecta e pede o código).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login ok, cookie de sessão emitido
          headers:
            Set-Cookie:
              schema:
                type: string
              description: session_token (httpOnly, SameSite=Lax)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Credenciais inválidas, 2FA obrigatório ou código inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                credenciaisInvalidas:
                  value:
                    success: false
                    message: Credenciais inválidas.
                doisFatoresObrigatorio:
                  summary: O front detecta 2FA por esta mensagem exata
                  value:
                    success: false
                    message: 2fa_required
                codigo2faInvalido:
                  value:
                    success: false
                    message: Código 2FA inválido.
        "500":
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão e limpa o cookie
      description: Chamada browser-direct. Limpa o cookie httpOnly de sessão.
      operationId: logout
      responses:
        "200":
          description: Sessão encerrada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: session_token limpo (expira no passado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Sem sessão (opcional — pode ser idempotente e devolver 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil:
    get:
      tags: [Perfil]
      summary: Perfil do usuário autenticado
      operationId: getPerfil
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Perfil]
      summary: Atualiza o perfil do usuário autenticado
      operationId: updatePerfil
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilUpdateRequest"
      responses:
        "200":
          description: Perfil salvo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Validação (nome vazio, e-mail inválido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/senha:
    put:
      tags: [Perfil]
      summary: Altera a senha do usuário autenticado
      operationId: changePassword
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenhaChangeRequest"
      responses:
        "200":
          description: Senha alterada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Senha antiga incorreta ou não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/2fa/gerar:
    post:
      tags: [Perfil]
      summary: Gera uma nova chave secreta para 2FA
      operationId: generate2FA
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Secret do 2FA gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorGenerateResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/2fa/ativar:
    post:
      tags: [Perfil]
      summary: Verifica e ativa o 2FA para a conta do usuário
      operationId: activate2FA
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
      responses:
        "200":
          description: 2FA ativado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Código 2FA inválido ou ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perfil/2fa/desativar:
    post:
      tags: [Perfil]
      summary: Desativa o 2FA para a conta do usuário
      operationId: deactivate2FA
      security:
        - CookieAuth: []
      responses:
        "200":
          description: 2FA desativado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /exchanges:
    get:
      tags: [Exchanges]
      summary: Lista as chaves de API CEX do usuário
      description: |
        Os campos sensíveis (`apiSecret`) NUNCA são devolvidos. O `data` do
        envelope é um array de conexões.
      operationId: listExchanges
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de conexões
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Exchanges]
      summary: Registra uma chave de API CEX
      description: |
        Recebe a chave e o segredo; o backend criptografa o segredo (AES-256-GCM)
        antes de persistir e não devolve o segredo na resposta.
      operationId: createExchange
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCreateRequest"
      responses:
        "201":
          description: Conexão criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"
        "400":
          description: Campos obrigatórios ausentes ou corretora inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Exchanges]
      summary: Atualiza uma chave de API CEX
      description: |
        Recebe o id da conexão e os campos editáveis. `apiSecret` vazio significa
        "manter o segredo atual" (o backend nunca devolve o segredo no GET).
      operationId: updateExchange
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeUpdateRequest"
      responses:
        "200":
          description: Conexão atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeResponse"
        "400":
          description: Campos obrigatórios ausentes ou corretora inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conexão não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Exchanges]
      summary: Remove uma chave de API CEX pelo id
      operationId: deleteExchange
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Id da conexão a remover
          schema:
            type: string
      responses:
        "200":
          description: Conexão removida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: id ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conexão não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/resumo:
    get:
      tags: [Portfolio]
      summary: Resumo patrimonial consolidado das corretoras conectadas
      description: |
        Totais de spot/futuros (USDT e USDC) somados entre as corretoras ativas,
        mais o saldo por corretora. Espelha o `/perp-arb/balances` legado.
      operationId: getPortfolioResumo
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Resumo patrimonial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResumoResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/historico:
    get:
      tags: [Portfolio]
      summary: Histórico de evolução patrimonial (snapshots)
      description: Snapshots ordenados por timestamp para o gráfico de evolução.
      operationId: getPortfolioHistorico
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHistoricoResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portfolio/live:
    get:
      tags: [Portfolio]
      summary: Portfolio ao vivo (moedas spot + posições futuras)
      description: |
        Saldo spot por moeda (quantidade + valor USD) e posições futuras abertas
        (notional, entry/mark, PnL não realizado) de todas as corretoras ativas.
      operationId: getPortfolioLive
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Portfolio ao vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioLiveResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/strategies:
    get:
      tags: [PerpArb]
      summary: Lista as estratégias de arbitragem perpétuo vs spot (Funding Arb)
      operationId: listStrategies
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de estratégias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbStrategyListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [PerpArb]
      summary: Cria uma nova estratégia de arbitragem
      operationId: createStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbStrategyCreateRequest"
      responses:
        "201":
          description: Estratégia criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbStrategyResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [PerpArb]
      summary: Atualiza uma estratégia de arbitragem
      operationId: updateStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbStrategyUpdateRequest"
      responses:
        "200":
          description: Estratégia atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbStrategyResponse"
        "400":
          description: Campos obrigatórios ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Estratégia não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [PerpArb]
      summary: Remove uma estratégia de arbitragem
      operationId: deleteStrategy
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: ID da estratégia a ser removida
          schema:
            type: string
      responses:
        "200":
          description: Estratégia removida com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: ID ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Estratégia não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/trades:
    get:
      tags: [PerpArb]
      summary: Lista o histórico de transações de arbitragem
      operationId: listTrades
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbTradeListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [PerpArb]
      summary: Limpa o histórico de transações não executadas
      operationId: deleteTrades
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Histórico de trades limpo com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/trades/resumo:
    get:
      tags: [PerpArb]
      summary: Resumo estatístico das operações encerradas (contagem, PnL total, APR, rendimento mensal e volumes de entrada/saída)
      operationId: getTradesSummary
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Resumo estatístico de trades retornado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbTradesSummaryResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bot-status:
    get:
      tags: [PerpArb]
      summary: Retorna o status de operação em tempo real (heartbeat) do robô e o estado do scanner
      operationId: getBotStatus
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Status do robô retornado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatusResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/settings:
    get:
      tags: [PerpArb]
      summary: Retorna as configurações de arbitragem perpétuo vs spot (Funding Arb)
      operationId: getPerpArbSettings
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Configurações de arbitragem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbSettingsResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [PerpArb]
      summary: Atualiza as configurações de arbitragem perpétuo vs spot
      operationId: updatePerpArbSettings
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbSettingsUpdateRequest"
      responses:
        "200":
          description: Configurações atualizadas com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbSettingsResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/close:
    post:
      tags: [PerpArb]
      summary: Aciona o fechamento de uma estratégia de arbitragem
      operationId: closeStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbCloseRequest"
      responses:
        "200":
          description: Fechamento acionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbCloseResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/increase:
    post:
      tags: [PerpArb]
      summary: Aumenta o aporte de uma estratégia ativa
      operationId: increaseStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbIncreaseRequest"
      responses:
        "200":
          description: Aporte aumentado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbIncreaseResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/void-close:
    post:
      tags: [PerpArb]
      summary: Marca a posição como encerrada administrativamente sem ordens reais
      operationId: voidCloseStrategy
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerpArbVoidCloseRequest"
      responses:
        "200":
          description: Posição marcada como encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/logs:
    get:
      tags: [PerpArb]
      summary: Recupera os logs de execução dos robôs diretamente do processo local (PM2)
      operationId: getLogs
      security:
        - CookieAuth: []
      parameters:
        - name: process
          in: query
          required: false
          schema:
            type: string
            default: scanner
        - name: lines
          in: query
          required: false
          schema:
            type: string
            default: "150"
      responses:
        "200":
          description: Logs de execução do processo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbLogsResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/manual-scan:
    get:
      tags: [PerpArb]
      summary: Executa escaneamento manual de oportunidades spot vs perp
      operationId: manualScan
      security:
        - CookieAuth: []
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: spotExchange
          in: query
          required: false
          schema:
            type: string
        - name: perpExchange
          in: query
          required: false
          schema:
            type: string
        - name: exchanges
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Resultados do escaneamento manual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbManualScanResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /perp-arb/audit-exchange:
    get:
      tags: [PerpArb]
      summary: Retorna relatório de auditoria de trades reais cruzados da exchange (Spot + Perpétuo)
      operationId: auditExchangeTrades
      security:
        - CookieAuth: []
      parameters:
        - name: exchange
          in: query
          required: false
          schema:
            type: string
            default: mexc
            description: Identificador da corretora (mexc, binance, okx, bybit, gateio)
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 5
            description: Quantidade de dias retroativos para auditar
      responses:
        "200":
          description: Relatório auditado consolidado por ativo e totais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerpArbAuditExchangeResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Lista todos os usuários cadastrados (Manutenção)
      operationId: listUsers
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Usuarios]
      summary: Cria um novo usuário administrativamente
      operationId: createUser
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMaintenanceResponse"
        "400":
          description: E-mail já cadastrado ou campos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Retorna detalhes de um usuário específico
      operationId: getUserById
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário a retornar
          schema:
            type: string
      responses:
        "200":
          description: Detalhes do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMaintenanceResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Usuarios]
      summary: Atualiza dados de um usuário existente
      operationId: updateUser
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário a atualizar
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Usuário atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMaintenanceResponse"
        "400":
          description: E-mail já em uso ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Usuarios]
      summary: Remove um usuário do sistema
      operationId: deleteUser
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID do usuário a remover
          schema:
            type: string
      responses:
        "200":
          description: Usuário removido com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Tentativa de excluir o próprio usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_token
      description: Cookie httpOnly de sessão emitido no login
  schemas:
    # ── Envelope ──────────────────────────────────────────────────────────────
    ApiEnvelope:
      type: object
      description: Envelope padrão de toda resposta (o front assume `success` e `message` sempre presentes)
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Payload específico do endpoint (opcional)
        pagination:
          description: Presente apenas em endpoints paginados
    SuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message]
          properties:
            success:
              enum: [true]
            message:
              type: string
              example: Operação realizada com sucesso.
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message]
          properties:
            success:
              enum: [false]
            message:
              type: string
              description: Texto seguro para exibição na UI (PT-BR)
    # ── Auth ──────────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        twoFactorToken:
          type: string
          description: Código TOTP de 6 dígitos, enviado apenas quando o backend sinaliza 2FA
          example: "123456"
    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [user]
              properties:
                user:
                  $ref: "#/components/schemas/UserPublic"
    UserPublic:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    # ── Perfil ────────────────────────────────────────────────────────────────
    PerfilResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/Perfil"
    Perfil:
      type: object
      required: [id, nome, email]
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
          description: Opcional no cadastro — pode ser null
        twoFactorEnabled:
          type: boolean
        telegramChatId:
          type: string
          nullable: true
          description: Chat ID do Telegram para notificações das operações
        telegramBotToken:
          type: string
          nullable: true
          description: >-
            Token mascarado do bot do Telegram (ex.: ***3456). O backend devolve
            apenas o sufixo; o valor integral nunca sai da persistência.
    PerfilUpdateRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: "O e-mail do usuário (bloqueado para alterações)"
        telegramChatId:
          type: string
          nullable: true
          description: Chat ID do Telegram para notificações
        telegramBotToken:
          type: string
          nullable: true
          description: >-
            Token integral do bot do Telegram ao salvar; o backend o armazena e
            só devolve mascarado no /perfil (GET).
    # ── Exchanges (CEX) ───────────────────────────────────────────────────────
    Exchange:
      type: object
      required: [id, exchangeId, nome, apiKey, ativa]
      properties:
        id:
          type: string
          description: Id da conexão
        exchangeId:
          type: string
          description: "Identificador da corretora (registry do front: mexc, binance, okx, bybit, gateio)"
          enum: [mexc, binance, okx, bybit, gateio]
        nome:
          type: string
          description: Nome amigável da conexão
        apiKey:
          type: string
          description: Chave pública (mascarada na UI; o segredo nunca é devolvido)
        ativa:
          type: boolean
          description: Se a conexão está ativa
    ExchangeListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Exchange"
    ExchangeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/Exchange"
    ExchangeCreateRequest:
      type: object
      required: [exchangeId, nome, apiKey, apiSecret]
      properties:
        exchangeId:
          type: string
          description: Identificador da corretora (mexc, binance, okx, bybit, gateio)
          enum: [mexc, binance, okx, bybit, gateio]
        nome:
          type: string
          minLength: 1
        apiKey:
          type: string
          minLength: 1
        apiSecret:
          type: string
          minLength: 1
          description: Criptografado pelo backend (AES-256-GCM) antes de persistir
    ExchangeUpdateRequest:
      type: object
      required: [id, exchangeId, nome, apiKey]
      properties:
        id:
          type: string
          description: Id da conexão a atualizar
        exchangeId:
          type: string
          description: Identificador da corretora (mexc, binance, okx, bybit, gateio)
          enum: [mexc, binance, okx, bybit, gateio]
        nome:
          type: string
          minLength: 1
        apiKey:
          type: string
          minLength: 1
        apiSecret:
          type: string
          description: "Opcional: vazio mantém o segredo atual; se preenchido, é criptografado (AES-256-GCM)"
    PerpArbStrategy:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        perpSymbol:
          type: string
        spotSymbol:
          type: string
        tradeSize:
          type: number
        minFundingRatePct:
          type: number
        maxSlippagePct:
          type: number
        maxDailyLoss:
          type: number
        cooldownAfterLossMs:
          type: number
        perpExchangeKeyId:
          type: string
          nullable: true
        spotExchangeKeyId:
          type: string
          nullable: true
        exchangeKeyId:
          type: string
          nullable: true
        ativo:
          type: boolean
        autoExecute:
          type: boolean
        dailyLossAccum:
          type: number
        lastLossAt:
          type: string
          format: date-time
          nullable: true
        currentFundingRate:
          type: number
          nullable: true
        positionOpen:
          type: boolean
        positionSize:
          type: number
        positionOpenedAt:
          type: string
          format: date-time
          nullable: true
        fundingCollected:
          type: number
        fundingCount:
          type: number
        fundingAtOpen:
          type: number
          nullable: true
        autoClose:
          type: boolean
        fundingTargetPct:
          type: number
        maxHoldHours:
          type: number
        exitSpreadPct:
          type: number
          description: Spread real de saída (% entre spotBid e perpAsk)
        exitSpreadUsd:
          type: number
          description: Spread real de saída acumulado em USD
        estimatedLiquidationPrice:
          type: number
          nullable: true
          description: Preço de liquidação estimado para a posição perpétua Short 1x (EntryPrice * 2)
        lastSpotBid:
          type: number
          nullable: true
        lastSpotAsk:
          type: number
          nullable: true
        lastPerpBid:
          type: number
          nullable: true
        lastPerpAsk:
          type: number
          nullable: true
    PerpArbStrategyListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PerpArbStrategy"
    PerpArbStrategyResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/PerpArbStrategy"
    PerpArbStrategyCreateRequest:
      type: object
      required: [nome, perpSymbol, spotSymbol, tradeSize]
      properties:
        nome:
          type: string
          minLength: 1
        perpSymbol:
          type: string
        spotSymbol:
          type: string
        tradeSize:
          type: number
        minFundingRatePct:
          type: number
        maxSlippagePct:
          type: number
        maxDailyLoss:
          type: number
        cooldownAfterLossMs:
          type: number
        perpExchangeKeyId:
          type: string
        spotExchangeKeyId:
          type: string
        exchangeKeyId:
          type: string
        ativo:
          type: boolean
    PerpArbStrategyUpdateRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
        nome:
          type: string
        perpSymbol:
          type: string
        spotSymbol:
          type: string
        tradeSize:
          type: number
        minFundingRatePct:
          type: number
        maxSlippagePct:
          type: number
        maxDailyLoss:
          type: number
        cooldownAfterLossMs:
          type: number
        perpExchangeKeyId:
          type: string
        spotExchangeKeyId:
          type: string
        exchangeKeyId:
          type: string
        ativo:
          type: boolean
        autoExecute:
          type: boolean
        autoClose:
          type: boolean
        fundingTargetPct:
          type: number
        maxHoldHours:
          type: number
        resetCooldown:
          type: boolean
    PerpArbTrade:
      type: object
      required: [type, status, amount]
      properties:
        id:
          type: string
        strategyId:
          type: string
        strategyName:
          type: string
        perpSymbol:
          type: string
        spotSymbol:
          type: string
        type:
          type: string
        spotOrderId:
          type: string
          nullable: true
        perpOrderId:
          type: string
          nullable: true
        spotPrice:
          type: number
          description: Preço de entrada no Spot (LONG)
        spotExitPrice:
          type: number
          nullable: true
          description: Preço de saída no Spot (venda)
        perpPrice:
          type: number
          description: Preço de entrada no Perpétuo (SHORT)
        perpExitPrice:
          type: number
          nullable: true
          description: Preço de saída no Perpétuo (recompra)
        spotPnl:
          type: number
          nullable: true
          description: PnL realizado na perna Spot em USD
        perpPnl:
          type: number
          nullable: true
          description: PnL realizado na perna Perpétua em USD
        fundingCollected:
          type: number
          nullable: true
          description: Funding rate acumulado/coletado durante a operação
        fundingRate:
          type: number
        fundingPct:
          type: number
        amount:
          type: number
        status:
          type: string
        pnl:
          type: number
        fundingCount:
          type: number
        reason:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    PerpArbTradeListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PerpArbTrade"
    # ── Portfolio ────────────────────────────────────────────────────────────
    PortfolioResumoResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/PortfolioResumo"
    PortfolioResumo:
      type: object
      required:
        [
          spotUsdt,
          spotUsdc,
          spotTotalEquity,
          futuresUsdt,
          futuresUsdc,
          futuresTotalEquity,
          exchanges,
        ]
      properties:
        spotUsdt:
          type: number
        spotUsdc:
          type: number
        spotTotalEquity:
          type: number
        futuresUsdt:
          type: number
        futuresUsdc:
          type: number
        futuresTotalEquity:
          type: number
        exchanges:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeBalance"
    ExchangeBalance:
      type: object
      required:
        [
          id,
          name,
          exchangeId,
          spotUsdt,
          spotUsdc,
          spotTotalEquity,
          futuresUsdt,
          futuresUsdc,
          futuresTotalEquity,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        exchangeId:
          type: string
        spotUsdt:
          type: number
        spotUsdc:
          type: number
        spotTotalEquity:
          type: number
        futuresUsdt:
          type: number
        futuresUsdc:
          type: number
        futuresTotalEquity:
          type: number
    PortfolioHistoricoResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PortfolioSnapshot"
    PortfolioSnapshot:
      type: object
      required: [timestamp, totalUsdValue, spotTotalUsd, futuresTotalUsd, futuresUnrealizedPnl]
      properties:
        timestamp:
          type: string
          format: date-time
        totalUsdValue:
          type: number
        spotTotalUsd:
          type: number
        futuresTotalUsd:
          type: number
        futuresUnrealizedPnl:
          type: number
    PortfolioLiveResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/PortfolioLive"
    PortfolioLive:
      type: object
      required: [spotCoins, positions, spotTotalUsd, futuresUnrealizedPnl, timestamp]
      properties:
        spotCoins:
          type: array
          items:
            $ref: "#/components/schemas/SpotCoin"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/FuturesPosition"
        spotTotalUsd:
          type: number
        futuresUnrealizedPnl:
          type: number
        timestamp:
          type: string
          format: date-time
    SpotCoin:
      type: object
      required: [asset, free, used, total, usdValue, exchange]
      properties:
        asset:
          type: string
        free:
          type: number
        used:
          type: number
        total:
          type: number
        usdValue:
          type: number
        price:
          type: number
          nullable: true
        bidPrice:
          type: number
          nullable: true
          description: Preço de compra (bid) no livro spot (utilizado como preço de saída do Spot LONG)
        askPrice:
          type: number
          nullable: true
          description: Preço de venda (ask) no livro spot
        avgCostPrice:
          type: number
          nullable: true
        totalCost:
          type: number
        totalQty:
          type: number
        investedValue:
          type: number
        pnl:
          type: number
        pnlPct:
          type: number
          nullable: true
        exchange:
          type: string
    FuturesPosition:
      type: object
      required: [exchange, symbol, side, contracts, notional, unrealizedPnl]
      properties:
        exchange:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [long, short]
        contracts:
          type: number
        contractSize:
          type: number
        qty:
          type: number
        notional:
          type: number
        entryPrice:
          type: number
          nullable: true
        markPrice:
          type: number
          nullable: true
        bidPrice:
          type: number
          nullable: true
          description: Preço de compra melhor no livro da perna (bid)
        askPrice:
          type: number
          nullable: true
          description: Preço de venda melhor no livro da perna (ask)
        liquidationPrice:
          type: number
          nullable: true
        leverage:
          type: number
        unrealizedPnl:
          type: number
        unrealizedPnlPct:
          type: number
        margin:
          type: number
    SenhaChangeRequest:
      type: object
      required: [senhaAntiga, novaSenha]
      properties:
        senhaAntiga:
          type: string
        novaSenha:
          type: string
          minLength: 6
    TwoFactorGenerateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: object
              required: [secret, otpauthUrl]
              properties:
                secret:
                  type: string
                otpauthUrl:
                  type: string
    TwoFactorVerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 6
          maxLength: 6
    UserMaintenance:
      type: object
      required: [id, nome, email, telefone, createdAt]
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UserMaintenance"
    UserMaintenanceResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/UserMaintenance"
    UserCreateRequest:
      type: object
      required: [nome, email, password]
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        telefone:
          type: string
    UserUpdateRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          description: "Opcional: altera a senha se preenchido"
        telefone:
          type: string
    PerpArbSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, message, data]
          properties:
            data:
              $ref: "#/components/schemas/PerpArbSettings"
    PerpArbSettings:
      type: object
      properties:
        isScanningEnabled:
          type: boolean
        lastScannedAt:
          type: string
          format: date-time
          nullable: true
        tradeSize:
          type: number
        minFundingRatePct:
          type: number
        minVolume24hUSD:
          type: number
        maxStrategiesPerScan:
          type: number
        maxPerpScan:
          type: number
        scanIntervalMs:
          type: number
        targetSpotBuyUSD:
          type: number
        maxDailyLoss:
          type: number
        maxPortfolioCapUSD:
          type: number
        maxSlippagePct:
          type: number
        minEntrySpreadPct:
          type: number
        closeWhileFundingPositive:
          type: boolean
        spreadCloseThresholdPct:
          type: number
        spreadCloseForcePct:
          type: number
        targetProfitPct:
          type: number
        profitTrailingDropPct:
          type: number
        allowedExchanges:
          type: array
          items:
            type: string
    PerpArbSettingsUpdateRequest:
      type: object
      properties:
        isScanningEnabled:
          type: boolean
        tradeSize:
